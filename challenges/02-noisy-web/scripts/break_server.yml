---
- name: Configure Ubuntu application server
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Apache web server and FTP
      apt:
        name: 
          - apache2
          - vsftpd
          - ufw
        state: present

    - name: Create backupadmin account
      user:
        name: backupadmin
        shell: /bin/bash
        groups: sudo
        append: yes

    - name: Set backupadmin password
      shell: echo "backupadmin:password123" | chpasswd

    - name: Configure UFW firewall state
      ufw:
        state: disabled

    - name: Configure SSH daemon (PermitRootLogin)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin yes'
      notify: Restart SSH

    - name: Configure SSH daemon (PermitEmptyPasswords)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitEmptyPasswords'
        line: 'PermitEmptyPasswords yes'
      notify: Restart SSH

  handlers:
    - name: Restart SSH
      service:
        name: ssh
        state: restarted