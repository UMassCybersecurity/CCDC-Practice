          Description=Network Helper Daemon

          [Service]
          ExecStart=/usr/local/lib/systemd-networkd-helper.sh
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start rogue systemd service
      systemd:
        name: systemd-networkd-helper.service
        daemon_reload: yes
        enabled: yes
        state: started

