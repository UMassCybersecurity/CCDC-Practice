        name: apache2
        state: present

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes

    # --- 1. Unauthorized root cron job ---
    - name: Plant unauthorized root cron job
      cron:
        name: "system cache sync"
        user: root
        minute: "*"
        job: "/usr/bin/id >> /tmp/.svc-cache 2>&1"

    # --- 2. Rogue systemd service, disguised name, enabled at boot ---
    - name: Drop rogue service payload script
      copy:
        dest: /usr/local/lib/systemd-networkd-helper.sh
        mode: "0755"
        content: |
          #!/bin/bash
          while true; do
              echo "$(date +%s) checkin" >> /var/log/.svc-helper
              sleep 5
          done

    - name: Install rogue systemd unit
      copy:
        dest: /etc/systemd/system/systemd-networkd-helper.service
